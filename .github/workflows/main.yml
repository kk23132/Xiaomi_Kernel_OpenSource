name: Build Mi 8 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout Xiaomi kernel source
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: dipper-q-oss
          fetch-depth: 1

      # ============================================================
      # 2. Install build dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            python3 \
            rsync \
            cpio \
            zip \
            unzip

      # ============================================================
      # 3. Download AOSP Clang r365631c
      # ============================================================
      - name: Download AOSP Clang 9
        run: |
          set -eux

          git clone \
            --depth=1 \
            -b android11-qpr3-release \
            --filter=blob:none \
            --sparse \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang-toolchain

          cd clang-toolchain

          git sparse-checkout set clang-r365631c

          cd ..

      # ============================================================
      # 4. Download AOSP GCC 4.9 - AArch64
      # ============================================================
      - name: Download AOSP GCC 4.9 AArch64
        run: |
          set -eux

          git clone \
            --depth=1 \
            -b android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            gcc64

      # ============================================================
      # 5. Download AOSP GCC 4.9 - ARM32
      # ============================================================
      - name: Download AOSP GCC 4.9 ARM32
        run: |
          set -eux

          git clone \
            --depth=1 \
            -b android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            gcc32

      # ============================================================
      # 6. Verify toolchains
      # ============================================================
      - name: Verify toolchains
        run: |
          set -eux

          echo "=================================================="
          echo "Clang"
          echo "=================================================="

          ./clang-toolchain/clang-r365631c/bin/clang --version

          echo
          echo "=================================================="
          echo "AArch64 GCC"
          echo "=================================================="

          ./gcc64/bin/aarch64-linux-android-gcc --version

          echo
          echo "=================================================="
          echo "AArch64 kernel GCC"
          echo "=================================================="

          ./gcc64/bin/aarch64-linux-androidkernel-gcc --version

          echo
          echo "=================================================="
          echo "ARM32 GCC"
          echo "=================================================="

          ./gcc32/bin/arm-linux-androideabi-gcc --version

          echo
          echo "=================================================="
          echo "ARM32 kernel GCC"
          echo "=================================================="

          ./gcc32/bin/arm-linux-androidkernel-gcc --version

          echo
          echo "=================================================="
          echo "Host GCC"
          echo "=================================================="

          gcc --version

          echo
          echo "=================================================="
          echo "Toolchain files"
          echo "=================================================="

          test -x ./clang-toolchain/clang-r365631c/bin/clang
          test -x ./gcc64/bin/aarch64-linux-android-gcc
          test -x ./gcc64/bin/aarch64-linux-androidkernel-gcc
          test -x ./gcc32/bin/arm-linux-androideabi-gcc
          test -x ./gcc32/bin/arm-linux-androidkernel-gcc

          echo "All required toolchains found."

      # ============================================================
      # 7. Check source configuration
      # ============================================================
      - name: Show source configuration
        run: |
          set -eux

          echo "=================================================="
          echo "Git branch"
          echo "=================================================="

          git branch --show-current

          echo
          echo "=================================================="
          echo "Git commit"
          echo "=================================================="

          git rev-parse HEAD

          echo
          echo "=================================================="
          echo "Kernel version"
          echo "=================================================="

          make kernelversion

          echo
          echo "=================================================="
          echo "Dipper defconfig"
          echo "=================================================="

          test -f arch/arm64/configs/dipper_user_defconfig

          echo "Found:"
          echo "arch/arm64/configs/dipper_user_defconfig"

      # ============================================================
      # 8. Build kernel
      # ============================================================
      - name: Build kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          set -euxo pipefail

          # --------------------------------------------------------
          # Toolchains
          # --------------------------------------------------------

          export CLANG="$GITHUB_WORKSPACE/clang-toolchain/clang-r365631c/bin/clang"

          export GCC64="$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-androidkernel-"

          export GCC32="$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androidkernel-"

          # --------------------------------------------------------
          # PATH
          # --------------------------------------------------------

          export PATH="$GITHUB_WORKSPACE/clang-toolchain/clang-r365631c/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          # --------------------------------------------------------
          # Kernel build variables
          # --------------------------------------------------------

          export CROSS_COMPILE="$GCC64"

          export CROSS_COMPILE_ARM32="$GCC32"

          export CLANG_TRIPLE="aarch64-linux-gnu-"

          # --------------------------------------------------------
          # Host build compatibility
          #
          # Linux 4.9's old scripts/dtc is incompatible with the
          # default -fno-common behavior of modern GCC.
          #
          # This affects HOSTCC tools only, not the ARM64 kernel.
          # --------------------------------------------------------

          export HOSTCFLAGS="-fcommon"

          # --------------------------------------------------------
          # Print environment
          # --------------------------------------------------------

          echo "=================================================="
          echo "Build environment"
          echo "=================================================="

          echo "ARCH=$ARCH"
          echo "SUBARCH=$SUBARCH"
          echo "CLANG=$CLANG"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"
          echo "CLANG_TRIPLE=$CLANG_TRIPLE"
          echo "HOSTCFLAGS=$HOSTCFLAGS"

          # --------------------------------------------------------
          # Compiler
          # --------------------------------------------------------

          echo
          echo "=================================================="
          echo "Compiler"
          echo "=================================================="

          "$CLANG" --version

          # --------------------------------------------------------
          # Remove incompatible old Clang warning option
          #
          # This is required because Clang 9 reports:
          #
          # warning: unknown warning option
          # '-Wno-undefined-optimized'
          #
          # The old kernel's cc-option test uses -Werror, so that
          # warning can incorrectly make -fstack-protector-strong
          # appear unsupported.
          # --------------------------------------------------------

          echo
          echo "=================================================="
          echo "Fix old Clang warning option"
          echo "=================================================="

          grep -n "Wno-undefined-optimized" Makefile || true

          sed -i '/Wno-undefined-optimized/d' Makefile

          echo
          echo "Remaining references:"
          grep -R -n \
            --exclude-dir=.git \
            --exclude-dir=out \
            "Wno-undefined-optimized" \
            Makefile arch scripts \
            2>/dev/null \
            || true

          # --------------------------------------------------------
          # Clean output directory
          # --------------------------------------------------------

          echo
          echo "=================================================="
          echo "Clean output directory"
          echo "=================================================="

          rm -rf out

          mkdir -p out

          # --------------------------------------------------------
          # Configure kernel
          # --------------------------------------------------------

          echo
          echo "=================================================="
          echo "Configure kernel"
          echo "=================================================="

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CC="$CLANG" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            HOSTCFLAGS="$HOSTCFLAGS" \
            dipper_user_defconfig

          # --------------------------------------------------------
          # Verify original stack protector configuration
          # --------------------------------------------------------

          echo
          echo "=================================================="
          echo "Stack protector configuration"
          echo "=================================================="

          grep -E \
            'CONFIG_CC_STACKPROTECTOR|CONFIG_CC_STACKPROTECTOR_NONE|CONFIG_CC_STACKPROTECTOR_REGULAR|CONFIG_CC_STACKPROTECTOR_STRONG' \
            out/.config \
            || true

          # --------------------------------------------------------
          # Re-normalize configuration
          # --------------------------------------------------------

          echo
          echo "=================================================="
          echo "Run olddefconfig"
          echo "=================================================="

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CC="$CLANG" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            HOSTCFLAGS="$HOSTCFLAGS" \
            olddefconfig

          # --------------------------------------------------------
          # Verify final configuration
          # --------------------------------------------------------

          echo
          echo "=================================================="
          echo "Final kernel configuration"
          echo "=================================================="

          grep -E \
            'CONFIG_CC_IS_CLANG|CONFIG_CLANG_VERSION|CONFIG_CC_STACKPROTECTOR|CONFIG_CC_STACKPROTECTOR_NONE|CONFIG_CC_STACKPROTECTOR_REGULAR|CONFIG_CC_STACKPROTECTOR_STRONG' \
            out/.config \
            || true

          test -f out/.config

          # --------------------------------------------------------
          # Build kernel
          # --------------------------------------------------------

          echo
          echo "=================================================="
          echo "Build kernel"
          echo "=================================================="

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CC="$CLANG" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            HOSTCFLAGS="$HOSTCFLAGS" \
            V=1 \
            -j"$(nproc)"

      # ============================================================
      # 9. Display build output
      # ============================================================
      - name: Show kernel output
        if: always()
        run: |
          set +e

          echo "=================================================="
          echo "Kernel output directory"
          echo "=================================================="

          if [ -d out/arch/arm64/boot ]; then
            find out/arch/arm64/boot \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort
          else
            echo "out/arch/arm64/boot does not exist."
          fi

          echo
          echo "=================================================="
          echo "DTB files"
          echo "=================================================="

          if [ -d out/arch/arm64/boot/dts ]; then
            find out/arch/arm64/boot/dts \
              -type f \
              \( -name "*.dtb" -o -name "*.dtbo" \) \
              | sort
          else
            echo "DTB directory does not exist."
          fi

          echo
          echo "=================================================="
          echo "Kernel configuration"
          echo "=================================================="

          if [ -f out/.config ]; then
            grep -E \
              'CONFIG_CC_STACKPROTECTOR|CONFIG_CC_STACKPROTECTOR_NONE|CONFIG_CC_STACKPROTECTOR_REGULAR|CONFIG_CC_STACKPROTECTOR_STRONG' \
              out/.config \
              || true
          fi

      # ============================================================
      # 10. Upload kernel artifacts
      # ============================================================
      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mi8-dipper-kernel
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dts/**/*.dtb
            out/arch/arm64/boot/dts/**/*.dtbo
            out/.config
            out/System.map
            out/vmlinux
          if-no-files-found: warn
