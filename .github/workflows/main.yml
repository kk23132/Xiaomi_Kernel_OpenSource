name: Build Mi 8 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: dipper-q-oss
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            python3 \
            rsync

      - name: Download AOSP Clang 9
        run: |
          git clone --depth=1 \
            -b clang-r365631c \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang-toolchain

      - name: Download AOSP GCC 4.9
        run: |
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            gcc64

          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            gcc32

      - name: Show source configuration
        run: |
          echo "=== Kernel branch ==="
          git branch --show-current

          echo "=== Kernel version ==="
          make kernelversion

          echo "=== Dipper defconfigs ==="
          find arch/arm64/configs -maxdepth 1 \
            -type f \
            -iname '*dipper*' \
            -print

      - name: Build kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          export CLANG="$GITHUB_WORKSPACE/clang-toolchain/clang-r365631c/bin/clang"
          export GCC64="$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-"
          export GCC32="$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-"

          export PATH="$GITHUB_WORKSPACE/clang-toolchain/clang-r365631c/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          export CROSS_COMPILE="$GCC64"
          export CROSS_COMPILE_ARM32="$GCC32"
          export CLANG_TRIPLE="aarch64-linux-gnu-"

          echo "=== Clang ==="
          "$CLANG" --version

          echo "=== Configure ==="
          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CC="$CLANG" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            dipper_user_defconfig

          echo "=== Build ==="
          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CC="$CLANG" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            -j"$(nproc)"

      - name: Show output
        run: |
          echo "=== Kernel output ==="
          find out/arch/arm64/boot -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: mi8-dipper-kernel
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dts/**/*.dtb
            out/arch/arm64/boot/dts/**/*.dtbo
          if-no-files-found: warn
