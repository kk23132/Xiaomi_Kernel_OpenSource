name: Build Xiaomi Mi 8 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout kernel source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1


      # ============================================================
      # 2. Dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libncurses5-dev \
            libncurses-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils


      # ============================================================
      # 3. Download AOSP GCC 4.9
      # ============================================================
      - name: Download AOSP GCC 4.9
        run: |
          set -e

          echo "=========================================="
          echo "Downloading AOSP GCC 4.9"
          echo "=========================================="

          git clone \
            --depth=1 \
            --branch android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            gcc64

          test -x gcc64/bin/aarch64-linux-android-gcc

          echo
          echo "=========================================="
          echo "GCC version"
          echo "=========================================="

          gcc64/bin/aarch64-linux-android-gcc --version


      # ============================================================
      # 4. Prepare GCC environment
      # ============================================================
      - name: Setup GCC environment
        run: |
          set -e

          echo "${GITHUB_WORKSPACE}/gcc64/bin" >> "$GITHUB_PATH"

          echo "GCC64=${GITHUB_WORKSPACE}/gcc64/bin" >> "$GITHUB_ENV"

          echo "GCC64=${GITHUB_WORKSPACE}/gcc64/bin"


      # ============================================================
      # 5. Verify GCC
      # ============================================================
      - name: Verify GCC
        run: |
          set -e

          echo "=========================================="
          echo "Checking GCC"
          echo "=========================================="

          which aarch64-linux-android-gcc

          aarch64-linux-android-gcc --version

          test -x "$GCC64/aarch64-linux-android-gcc"

          echo
          echo "GCC path:"
          echo "$GCC64/aarch64-linux-android-gcc"


      # ============================================================
      # 6. Fix gcc-wrapper.py for Python 3
      #
      # Original Xiaomi kernel wrapper is Python 2 code.
      #
      # GitHub Actions uses Python 3, therefore:
      #
      #   - print >> sys.stderr
      #   - bytes / str handling
      #
      # must be fixed.
      #
      # This does NOT modify kernel build logic.
      # ============================================================
      - name: Fix gcc-wrapper.py Python 3 compatibility
        run: |
          set -e

          echo "=========================================="
          echo "Fixing gcc-wrapper.py"
          echo "=========================================="

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/gcc-wrapper.py")

          if not path.exists():
              raise SystemExit("ERROR: scripts/gcc-wrapper.py not found")

          path.write_text(r'''#!/usr/bin/env python3
          # -*- coding: utf-8 -*-

          # Copyright (c) 2011-2016, The Linux Foundation. All rights reserved.
          #
          # Redistribution and use in source and binary forms, with or without
          # modification, are permitted provided that the following conditions are met:
          #     * Redistributions of source code must retain the above copyright
          #       notice, this list of conditions and the following disclaimer.
          #     * Redistributions in binary form must reproduce the above copyright
          #       notice, this list of conditions and the following disclaimer in the
          #       documentation and/or other materials provided with the distribution.
          #     * Neither the name of The Linux Foundation nor
          #       the names of its contributors may be used to endorse or promote
          #       products derived from this software without specific prior written
          #       permission.
          #
          # THIS SOFTWARE IS PROVIDED BY THE COPYRIGHT HOLDERS AND CONTRIBUTORS "AS IS"
          # AND ANY EXPRESS OR IMPLIED WARRANTIES, INCLUDING, BUT NOT LIMITED TO, THE
          # IMPLIED WARRANTIES OF MERCHANTABILITY AND FITNESS FOR A PARTICULAR PURPOSE
          # ARE DISCLAIMED. IN NO EVENT SHALL THE COPYRIGHT OWNER OR CONTRIBUTORS BE
          # LIABLE FOR ANY DIRECT, INDIRECT, INCIDENTAL, SPECIAL, EXEMPLARY, OR
          # CONSEQUENTIAL DAMAGES (INCLUDING, BUT NOT LIMITED TO, PROCUREMENT OF
          # SUBSTITUTE GOODS OR SERVICES; LOSS OF USE, DATA, OR PROFITS; OR BUSINESS
          # INTERRUPTION) HOWEVER CAUSED AND ON ANY THEORY OF LIABILITY, WHETHER IN
          # CONTRACT, STRICT LIABILITY, OR TORT (INCLUDING NEGLIGENCE OR OTHERWISE)
          # ARISING IN ANY WAY OUT OF THE USE OF THIS SOFTWARE, EVEN IF ADVISED OF THE
          # POSSIBILITY OF SUCH DAMAGE.

          import errno
          import re
          import os
          import sys
          import subprocess

          allowed_warnings = set([
              "core.c:144",
              "inet_connection_sock.c:430",
              "inet_connection_sock.c:467",
              "inet6_connection_sock.c:89",
          ])

          ofile = None

          warning_re = re.compile(
              r'''(.*/|)([^/]+\.[a-z]+:\d+):(\d+:)? warning:'''
          )


          def interpret_warning(line):
              """Decode the message from gcc."""

              if isinstance(line, bytes):
                  line = line.decode('utf-8', errors='replace')

              line = line.rstrip('\n')

              m = warning_re.match(line)

              if m and m.group(2) not in allowed_warnings:
                  print(
                      "error, forbidden warning:",
                      m.group(2),
                      file=sys.stderr
                  )

                  if ofile:
                      try:
                          os.remove(ofile)
                      except OSError:
                          pass

                  sys.exit(1)


          def run_gcc():
              args = sys.argv[1:]

              try:
                  i = args.index('-o')

                  global ofile
                  ofile = args[i + 1]

              except (ValueError, IndexError):
                  pass

              try:
                  proc = subprocess.Popen(
                      args,
                      stderr=subprocess.PIPE
                  )

                  for line in proc.stderr:

                      if isinstance(line, bytes):
                          line = line.decode(
                              'utf-8',
                              errors='replace'
                          )

                      print(
                          line,
                          end='',
                          file=sys.stderr
                      )

                      interpret_warning(line)

                  result = proc.wait()

              except OSError as e:
                  result = e.errno

                  if result == errno.ENOENT:
                      print(
                          args[0] + ':',
                          e.strerror,
                          file=sys.stderr
                      )

                      print(
                          'Is your PATH set correctly?',
                          file=sys.stderr
                      )

                  else:
                      print(
                          ' '.join(args),
                          str(e),
                          file=sys.stderr
                      )

              return result


          if __name__ == '__main__':
              status = run_gcc()
              sys.exit(status)
          ''', encoding="utf-8")

          print("gcc-wrapper.py has been converted to Python 3.")


      # ============================================================
      # 7. Verify gcc-wrapper.py
      # ============================================================
      - name: Verify gcc-wrapper.py
        run: |
          set -e

          echo "=========================================="
          echo "Checking gcc-wrapper.py"
          echo "=========================================="

          head -n 3 scripts/gcc-wrapper.py

          python3 --version

          python3 -m py_compile \
            scripts/gcc-wrapper.py

          echo
          echo "gcc-wrapper.py syntax check: OK"


      # ============================================================
      # 8. Prepare stock kernel config
      # ============================================================
      - name: Prepare kernel configuration
        run: |
          set -e

          if [ ! -f config/running.config ]; then
            echo "ERROR: config/running.config does not exist!"
            exit 1
          fi

          mkdir -p out

          cp \
            config/running.config \
            out/.config

          echo "=========================================="
          echo "Running olddefconfig"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "Config generated successfully."

          test -f out/.config


      # ============================================================
      # 9. Compare configuration
      # ============================================================
      - name: Compare kernel config
        run: |
          set +e

          diff -u \
            config/running.config \
            out/.config \
            > config.diff

          RESULT=$?

          echo "=========================================="
          echo "Configuration comparison"
          echo "=========================================="

          if [ "$RESULT" -eq 0 ]; then
            echo "No configuration differences."
          else
            echo "Configuration differences:"
            cat config.diff
          fi

          exit 0


      # ============================================================
      # 10. Build kernel
      #
      # IMPORTANT:
      #
      # Target compiler:
      #   AOSP GCC 4.9
      #
      # Host compiler:
      #   Ubuntu host GCC
      #
      # HOSTCFLAGS=-fcommon is required because this old
      # kernel's DTC source expects the old GCC common-symbol
      # behavior.
      #
      # This does NOT change ARM64 target compiler flags.
      # ============================================================
      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="${GCC64}/aarch64-linux-android-"

          # Required for old scripts/dtc code when building
          # with modern Ubuntu host GCC.
          export HOSTCFLAGS="-fcommon"

          echo "=========================================="
          echo "Kernel build configuration"
          echo "=========================================="

          echo "ARCH=${ARCH}"
          echo "SUBARCH=${SUBARCH}"
          echo "CROSS_COMPILE=${CROSS_COMPILE}"
          echo "HOSTCFLAGS=${HOSTCFLAGS}"

          echo
          echo "=========================================="
          echo "Target compiler"
          echo "=========================================="

          "${CROSS_COMPILE}gcc" --version

          echo
          echo "=========================================="
          echo "Host compiler"
          echo "=========================================="

          gcc --version

          echo
          echo "=========================================="
          echo "Starting kernel build"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            HOSTCFLAGS="${HOSTCFLAGS}" \
            Image.gz-dtb \
            -j"$(nproc)"


      # ============================================================
      # 11. Verify output
      # ============================================================
      - name: Verify kernel output
        run: |
          set -e

          echo "=========================================="
          echo "Kernel output"
          echo "=========================================="

          find out/arch/arm64/boot \
            -maxdepth 1 \
            -type f \
            -printf "%f  %s bytes\n" \
            | sort

          echo
          echo "=========================================="
          echo "Checking Image.gz-dtb"
          echo "=========================================="

          test -f \
            out/arch/arm64/boot/Image.gz-dtb

          ls -lh \
            out/arch/arm64/boot/Image.gz-dtb


      # ============================================================
      # 12. Show important configuration
      # ============================================================
      - name: Show important kernel configuration
        run: |
          echo "=========================================="
          echo "Sound configuration"
          echo "=========================================="

          grep -E \
            '^(CONFIG_SND|CONFIG_SND_SOC|CONFIG_SLIMBUS|CONFIG_OF_SLIMBUS|CONFIG_MSM_ADSPRPC|CONFIG_MSM_PIL_MSS_QDSP6V5|CONFIG_SPMI|CONFIG_REGMAP_SPMI)' \
            out/.config \
            || true

          echo
          echo "=========================================="
          echo "Subsystem restart configuration"
          echo "=========================================="

          grep -E \
            '^(CONFIG_MSM_SUBSYSTEM_RESTART|CONFIG_IPA|CONFIG_QCOM_IPA)' \
            out/.config \
            || true


      # ============================================================
      # 13. Prepare artifacts
      # ============================================================
      - name: Prepare artifacts
        run: |
          set -e

          mkdir -p artifacts

          cp \
            out/arch/arm64/boot/Image.gz-dtb \
            artifacts/Image.gz-dtb

          cp \
            out/.config \
            artifacts/kernel.config

          cp \
            config/running.config \
            artifacts/running.config

          if [ -f config.diff ]; then
            cp \
              config.diff \
              artifacts/config.diff
          fi

          if [ -f out/System.map ]; then
            cp \
              out/System.map \
              artifacts/System.map
          fi

          if [ -f out/arch/arm64/boot/Image ]; then
            cp \
              out/arch/arm64/boot/Image \
              artifacts/Image
          fi

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp \
              out/arch/arm64/boot/Image.gz \
              artifacts/Image.gz
          fi

          echo "=========================================="
          echo "Artifacts"
          echo "=========================================="

          ls -lh artifacts/


      # ============================================================
      # 14. Upload artifacts
      # ============================================================
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dipper-kernel-gcc49
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
