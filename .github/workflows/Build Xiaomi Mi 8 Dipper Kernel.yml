name: Build Xiaomi Mi 8 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # 1. Checkout kernel source
      # ============================================================
      - name: Checkout kernel source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ============================================================
      # 2. Install build dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libssl-dev \
            libelf-dev \
            lz4 \
            libncurses5-dev \
            libncurses-dev \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils

      # ============================================================
      # 3. Download AOSP Clang r349610
      #
      # Android 10 kernel 4.9 uses clang-r349610.
      # IMPORTANT:
      # Do NOT use clang-r365631c here.
      # ============================================================
      - name: Download AOSP Clang r349610
        run: |
          git clone \
            --depth=1 \
            --branch android10-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang-repo

          test -x clang-repo/clang-r349610/bin/clang

          echo "========== Clang version =========="
          clang-repo/clang-r349610/bin/clang --version

      # ============================================================
      # 4. Download AOSP GCC 4.9 AArch64
      #
      # Use Android 10 release branch.
      # Do NOT clone main.
      # ============================================================
      - name: Download AOSP GCC 4.9
        run: |
          git clone \
            --depth=1 \
            --branch android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            gcc64

          test -x gcc64/bin/aarch64-linux-android-gcc

          echo "========== GCC version =========="
          gcc64/bin/aarch64-linux-android-gcc --version

      # ============================================================
      # 5. Prepare toolchain environment
      # ============================================================
      - name: Setup toolchain
        run: |
          echo "CLANG=${GITHUB_WORKSPACE}/clang-repo/clang-r349610/bin" >> $GITHUB_ENV
          echo "GCC64=${GITHUB_WORKSPACE}/gcc64/bin" >> $GITHUB_ENV

          echo "${GITHUB_WORKSPACE}/clang-repo/clang-r349610/bin" >> $GITHUB_PATH
          echo "${GITHUB_WORKSPACE}/gcc64/bin" >> $GITHUB_PATH

      # ============================================================
      # 6. Verify toolchains
      # ============================================================
      - name: Verify toolchains
        run: |
          set -e

          echo "=========================================="
          echo "Clang"
          echo "=========================================="
          "$CLANG/clang" --version

          echo
          echo "=========================================="
          echo "GCC"
          echo "=========================================="
          "$GCC64/aarch64-linux-android-gcc" --version

          echo
          echo "=========================================="
          echo "Toolchain files"
          echo "=========================================="

          test -x "$CLANG/clang"
          test -x "$GCC64/aarch64-linux-android-gcc"

          ls -l "$CLANG/clang"
          ls -l "$GCC64/aarch64-linux-android-gcc"

      # ============================================================
      # 7. Prepare stock kernel configuration
      #
      # IMPORTANT:
      # Put your real stock config here:
      #
      # config/running.config
      #
      # It must be the complete config obtained from:
      #
      # adb shell su -c "zcat /proc/config.gz"
      # ============================================================
      - name: Prepare kernel configuration
        run: |
          set -e

          if [ ! -f config/running.config ]; then
            echo "ERROR: config/running.config not found!"
            echo
            echo "Please put your stock /proc/config.gz output here:"
            echo "    config/running.config"
            exit 1
          fi

          mkdir -p out

          cp config/running.config out/.config

          echo "========== Running olddefconfig =========="

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "========== Config generated =========="

          test -f out/.config

          wc -l config/running.config
          wc -l out/.config

      # ============================================================
      # 8. Compare stock config with generated config
      # ============================================================
      - name: Compare kernel config
        run: |
          set +e

          diff -u \
            config/running.config \
            out/.config \
            > config.diff

          DIFF_EXIT=$?

          echo "========== config.diff =========="

          if [ "$DIFF_EXIT" -eq 0 ]; then
            echo "No config differences."
          else
            cat config.diff
          fi

          exit 0

      # ============================================================
      # 9. Build kernel
      #
      # IMPORTANT:
      #
      # Do NOT use:
      #     CC=clang
      #
      # Xiaomi's Makefile uses:
      #     REAL_CC
      #
      # Therefore we explicitly provide:
      #     REAL_CC=.../clang
      #
      # CLANG_TRIPLE is also required.
      # ============================================================
      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="${GCC64}/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32=""

          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export REAL_CC="${CLANG}/clang"

          echo "=========================================="
          echo "Kernel build configuration"
          echo "=========================================="

          echo "ARCH=${ARCH}"
          echo "SUBARCH=${SUBARCH}"
          echo "CROSS_COMPILE=${CROSS_COMPILE}"
          echo "CLANG_TRIPLE=${CLANG_TRIPLE}"
          echo "REAL_CC=${REAL_CC}"

          echo
          echo "=========================================="
          echo "Starting kernel build"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            REAL_CC="${REAL_CC}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            Image.gz-dtb \
            -j"$(nproc)"

      # ============================================================
      # 10. Verify generated kernel
      # ============================================================
      - name: Verify kernel output
        run: |
          set -e

          echo "=========================================="
          echo "Kernel output"
          echo "=========================================="

          find out/arch/arm64/boot \
            -maxdepth 1 \
            -type f \
            -printf "%f  %s bytes\n" \
            | sort

          echo
          echo "=========================================="
          echo "Required files"
          echo "=========================================="

          test -f out/arch/arm64/boot/Image.gz-dtb

          echo "Image.gz-dtb:"
          ls -lh out/arch/arm64/boot/Image.gz-dtb

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo
            echo "Image.gz:"
            ls -lh out/arch/arm64/boot/Image.gz
          fi

          if [ -f out/arch/arm64/boot/Image ]; then
            echo
            echo "Image:"
            ls -lh out/arch/arm64/boot/Image
          fi

          if [ -f out/System.map ]; then
            echo
            echo "System.map:"
            ls -lh out/System.map
          fi

      # ============================================================
      # 11. Check kernel configuration actually used for build
      # ============================================================
      - name: Show important kernel config
        run: |
          echo "========== Sound configuration =========="

          grep -E \
            '^(CONFIG_SND|CONFIG_SND_SOC|CONFIG_SLIBUS|CONFIG_SLIMBUS|CONFIG_MSM_ADSPRPC|CONFIG_MSM_PIL_MSS_QDSP6V5|CONFIG_SPMI|CONFIG_REGMAP_SPMI)' \
            out/.config \
            || true

          echo
          echo "========== IPA configuration =========="

          grep -E \
            '^(CONFIG_MSM_SUBSYSTEM_RESTART|CONFIG_IPA|CONFIG_QCOM_IPA)' \
            out/.config \
            || true

      # ============================================================
      # 12. Collect build artifacts
      #
      # No boot.img repacking.
      # No Magisk patching.
      # Only upload kernel-related files.
      # ============================================================
      - name: Prepare artifacts
        run: |
          set -e

          mkdir -p artifacts

          # Main kernel used for boot.img replacement
          cp out/arch/arm64/boot/Image.gz-dtb \
             artifacts/Image.gz-dtb

          # Other kernel forms, if generated
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz \
               artifacts/Image.gz
          fi

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image \
               artifacts/Image
          fi

          # Kernel config
          cp out/.config \
             artifacts/kernel.config

          # Config comparison
          cp config/running.config \
             artifacts/running.config

          if [ -f config.diff ]; then
            cp config.diff \
               artifacts/config.diff
          fi

          # Symbol map
          if [ -f out/System.map ]; then
            cp out/System.map \
               artifacts/System.map
          fi

          echo
          echo "=========================================="
          echo "Final artifacts"
          echo "=========================================="

          ls -lh artifacts/

      # ============================================================
      # 13. Upload artifacts
      # ============================================================
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dipper-kernel
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
