name: Build Xiaomi Mi 8 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout kernel source
      # ============================================================
      - name: Checkout kernel source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1


      # ============================================================
      # 2. Install build dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libncurses5-dev \
            libncurses-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils

          echo "=========================================="
          echo "Dependencies installed"
          echo "=========================================="


      # ============================================================
      # 3. Verify Python 3
      # ============================================================
      - name: Verify Python
        run: |
          set -e

          echo "=========================================="
          echo "Python version"
          echo "=========================================="

          python3 --version
          which python3


      # ============================================================
      # 4. Verify gcc-wrapper.py
      #
      # IMPORTANT:
      # gcc-wrapper.py has already been modified in the source tree.
      # DO NOT rewrite it here.
      # ============================================================
      - name: Verify gcc-wrapper.py
        run: |
          set -e

          echo "=========================================="
          echo "Verifying gcc-wrapper.py"
          echo "=========================================="

          test -f scripts/gcc-wrapper.py

          echo "gcc-wrapper.py location:"
          echo "scripts/gcc-wrapper.py"

          echo
          echo "First lines:"
          head -n 10 scripts/gcc-wrapper.py

          echo
          echo "Python syntax check:"
          python3 -m py_compile scripts/gcc-wrapper.py

          echo "Python syntax check passed."

          echo
          echo "Checking for Python 2 print syntax..."

          if grep -q 'print >>' scripts/gcc-wrapper.py; then
            echo "ERROR: Python 2 print syntax detected:"
            grep -n 'print >>' scripts/gcc-wrapper.py
            exit 1
          fi

          echo "No Python 2 print syntax found."

          echo
          echo "Checking Python interpreter declaration..."

          head -n 1 scripts/gcc-wrapper.py

          echo
          echo "gcc-wrapper.py verification complete."


      # ============================================================
      # 5. Download AOSP GCC 4.9
      #
      # This is the compiler used to build the Android Q kernel.
      # ============================================================
      - name: Download AOSP GCC 4.9
        run: |
          set -e

          echo "=========================================="
          echo "Downloading AOSP GCC 4.9"
          echo "=========================================="

          git clone \
            --depth=1 \
            --branch android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            gcc64

          test -x gcc64/bin/aarch64-linux-android-gcc

          echo
          echo "AOSP GCC version:"
          gcc64/bin/aarch64-linux-android-gcc --version


      # ============================================================
      # 6. Setup GCC environment
      # ============================================================
      - name: Setup GCC environment
        run: |
          set -e

          echo "${GITHUB_WORKSPACE}/gcc64/bin" >> "$GITHUB_PATH"
          echo "GCC64=${GITHUB_WORKSPACE}/gcc64/bin" >> "$GITHUB_ENV"

          echo "GCC64=${GITHUB_WORKSPACE}/gcc64/bin"


      # ============================================================
      # 7. Verify GCC
      # ============================================================
      - name: Verify GCC
        run: |
          set -e

          echo "=========================================="
          echo "Verifying AOSP GCC 4.9"
          echo "=========================================="

          which aarch64-linux-android-gcc

          aarch64-linux-android-gcc --version

          test -x "$GCC64/aarch64-linux-android-gcc"

          echo
          echo "Compiler:"
          echo "$GCC64/aarch64-linux-android-gcc"

          echo
          echo "GCC verification complete."


      # ============================================================
      # 8. Prepare kernel configuration
      # ============================================================
      - name: Prepare kernel configuration
        run: |
          set -e

          echo "=========================================="
          echo "Preparing kernel configuration"
          echo "=========================================="

          if [ ! -f config/running.config ]; then
            echo "ERROR: config/running.config does not exist!"
            exit 1
          fi

          mkdir -p out

          cp config/running.config out/.config

          echo
          echo "Running olddefconfig..."

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          test -f out/.config

          echo
          echo "Kernel configuration prepared."

          echo
          echo "Config file:"
          ls -lh out/.config


      # ============================================================
      # 9. Compare original config and generated config
      #
      # This lets us see whether olddefconfig changed anything.
      # ============================================================
      - name: Compare kernel config
        run: |
          set +e

          echo "=========================================="
          echo "Comparing kernel configuration"
          echo "=========================================="

          diff -u \
            config/running.config \
            out/.config \
            > config.diff

          RESULT=$?

          if [ "$RESULT" -eq 0 ]; then
            echo "No configuration differences."
          else
            echo
            echo "Configuration differences:"
            echo "------------------------------------------"
            cat config.diff
            echo "------------------------------------------"
          fi

          # Do not fail build because olddefconfig changed config.
          exit 0


      # ============================================================
      # 10. Show compiler and build environment
      # ============================================================
      - name: Show build environment
        run: |
          set -e

          echo "=========================================="
          echo "Build environment"
          echo "=========================================="

          echo "Kernel source:"
          echo "${GITHUB_WORKSPACE}"

          echo
          echo "Kernel output:"
          echo "${GITHUB_WORKSPACE}/out"

          echo
          echo "ARCH:"
          echo "arm64"

          echo
          echo "SUBARCH:"
          echo "arm64"

          echo
          echo "CROSS_COMPILE:"
          echo "${GCC64}/aarch64-linux-android-"

          echo
          echo "Host compiler:"
          gcc --version | head -n 1

          echo
          echo "Target compiler:"
          "${GCC64}/aarch64-linux-android-gcc" --version | head -n 1


      # ============================================================
      # 11. Build kernel
      #
      # HOSTCFLAGS=-fcommon:
      #
      # The old kernel DTC source defines yylloc in multiple objects.
      # Old GCC defaults allowed common symbols, while modern Ubuntu
      # host GCC uses -fno-common by default.
      #
      # This flag affects HOST tools such as DTC only.
      # It does NOT modify ARM64 kernel compiler flags.
      # ============================================================
      - name: Build kernel
        run: |
          set -e

          echo "=========================================="
          echo "Starting kernel build"
          echo "=========================================="

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="${GCC64}/aarch64-linux-android-"

          # Required for old kernel DTC with modern host GCC.
          export HOSTCFLAGS="-fcommon"

          echo
          echo "ARCH=${ARCH}"
          echo "SUBARCH=${SUBARCH}"
          echo "CROSS_COMPILE=${CROSS_COMPILE}"
          echo "HOSTCFLAGS=${HOSTCFLAGS}"

          echo
          echo "Target compiler:"
          "${CROSS_COMPILE}gcc" --version

          echo
          echo "Building Image.gz-dtb..."
          echo

          make \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            HOSTCFLAGS="${HOSTCFLAGS}" \
            Image.gz-dtb \
            -j"$(nproc)"

          echo
          echo "=========================================="
          echo "Kernel build completed"
          echo "=========================================="


      # ============================================================
      # 12. Verify kernel output
      # ============================================================
      - name: Verify kernel output
        run: |
          set -e

          echo "=========================================="
          echo "Verifying kernel output"
          echo "=========================================="

          KERNEL="out/arch/arm64/boot/Image.gz-dtb"

          if [ ! -f "$KERNEL" ]; then
            echo "ERROR: Kernel output not found!"
            exit 1
          fi

          echo
          echo "Kernel found:"
          echo "$KERNEL"

          echo
          echo "Kernel size:"
          ls -lh "$KERNEL"

          echo
          echo "File type:"
          file "$KERNEL"

          echo
          echo "Kernel output verification complete."


      # ============================================================
      # 13. Show important sound-related configuration
      # ============================================================
      - name: Show important kernel configuration
        run: |
          set -e

          echo "=========================================="
          echo "Sound / Audio configuration"
          echo "=========================================="

          echo
          echo "----- CONFIG_SND -----"

          grep -E \
            '^(CONFIG_SND|CONFIG_SND_SOC)' \
            out/.config \
            || true

          echo
          echo "----- SLIMbus -----"

          grep -E \
            '^(CONFIG_SLIMBUS|CONFIG_OF_SLIMBUS)' \
            out/.config \
            || true

          echo
          echo "----- Qualcomm audio / ADSP -----"

          grep -E \
            '^(CONFIG_MSM_ADSPRPC|CONFIG_MSM_PIL_MSS_QDSP6V5)' \
            out/.config \
            || true

          echo
          echo "----- SPMI / REGMAP -----"

          grep -E \
            '^(CONFIG_SPMI|CONFIG_REGMAP_SPMI)' \
            out/.config \
            || true

          echo
          echo "----- Qualcomm audio related -----"

          grep -Ei \
            '^(CONFIG_.*AUDIO|CONFIG_.*SOUND|CONFIG_.*WCD|CONFIG_.*CODEC)' \
            out/.config \
            || true


      # ============================================================
      # 14. Show modem / IPA configuration
      # ============================================================
      - name: Show modem and IPA configuration
        run: |
          set -e

          echo "=========================================="
          echo "Modem / IPA configuration"
          echo "=========================================="

          echo
          echo "----- Subsystem restart -----"

          grep -E \
            '^(CONFIG_MSM_SUBSYSTEM_RESTART|CONFIG_MSM_PIL)' \
            out/.config \
            || true

          echo
          echo "----- IPA -----"

          grep -Ei \
            '^(CONFIG_.*IPA)' \
            out/.config \
            || true

          echo
          echo "----- QCOM -----"

          grep -Ei \
            '^(CONFIG_.*QCOM)' \
            out/.config \
            || true


      # ============================================================
      # 15. Show kernel build information
      # ============================================================
      - name: Show kernel build information
        run: |
          set -e

          echo "=========================================="
          echo "Kernel build information"
          echo "=========================================="

          echo
          echo "Linux version:"
          grep '^Linux version' out/include/generated/compile.h \
            2>/dev/null \
            || true

          echo
          echo "Kernel release:"
          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="${GCC64}/aarch64-linux-android-" \
            kernelversion \
            || true

          echo
          echo "Build information complete."


      # ============================================================
      # 16. Prepare artifacts
      # ============================================================
      - name: Prepare artifacts
        run: |
          set -e

          echo "=========================================="
          echo "Preparing artifacts"
          echo "=========================================="

          mkdir -p artifacts

          # Main kernel
          cp \
            out/arch/arm64/boot/Image.gz-dtb \
            artifacts/Image.gz-dtb

          # Generated kernel config
          cp \
            out/.config \
            artifacts/kernel.config

          # Original running config
          cp \
            config/running.config \
            artifacts/running.config

          # Config differences
          if [ -f config.diff ]; then
            cp \
              config.diff \
              artifacts/config.diff
          fi

          # System.map
          if [ -f out/System.map ]; then
            cp \
              out/System.map \
              artifacts/System.map
          fi

          # Uncompressed Image
          if [ -f out/arch/arm64/boot/Image ]; then
            cp \
              out/arch/arm64/boot/Image \
              artifacts/Image
          fi

          # Compressed Image
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp \
              out/arch/arm64/boot/Image.gz \
              artifacts/Image.gz
          fi

          echo
          echo "Artifacts:"
          ls -lh artifacts/


      # ============================================================
      # 17. Upload artifacts
      # ============================================================
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dipper-kernel-gcc49
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
