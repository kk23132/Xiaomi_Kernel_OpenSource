name: Build Xiaomi Mi 8 Dipper Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Dipper Kernel
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: dipper-q-oss
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            gawk \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            make \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils

      - name: Prepare directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchains"
          mkdir -p "$GITHUB_WORKSPACE/out"

          echo "=========================================="
          echo "Kernel source"
          echo "=========================================="
          pwd

          echo
          echo "=========================================="
          echo "Running config"
          echo "=========================================="
          ls -lh config/running.config


      - name: Download AOSP Clang 9.0.8
        run: |
          cd "$GITHUB_WORKSPACE/toolchains"

          echo "=========================================="
          echo "Downloading AOSP Clang r365631c"
          echo "=========================================="

          git clone \
            --depth=1 \
            --branch android11-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang-repo

          echo
          echo "=========================================="
          echo "Checking clang-r365631c"
          echo "=========================================="

          if [ ! -d "clang-repo/clang-r365631c" ]; then
            echo "ERROR: clang-r365631c was not found!"
            echo
            echo "Available Clang versions:"
            ls -1 clang-repo | grep '^clang-' || true
            exit 1
          fi

          mv clang-repo/clang-r365631c clang-r365631c

          rm -rf clang-repo

          echo
          echo "=========================================="
          echo "Clang version"
          echo "=========================================="

          clang-r365631c/bin/clang --version


      - name: Download GCC 4.9 AArch64
        run: |
          cd "$GITHUB_WORKSPACE/toolchains"

          echo "=========================================="
          echo "Downloading AArch64 GCC 4.9"
          echo "=========================================="

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            gcc64

          echo
          echo "=========================================="
          echo "AArch64 GCC version"
          echo "=========================================="

          gcc64/bin/aarch64-linux-android-gcc --version


      - name: Download GCC 4.9 ARM32
        run: |
          cd "$GITHUB_WORKSPACE/toolchains"

          echo "=========================================="
          echo "Downloading ARM32 GCC 4.9"
          echo "=========================================="

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            gcc32

          echo
          echo "=========================================="
          echo "ARM32 GCC version"
          echo "=========================================="

          gcc32/bin/arm-linux-androideabi-gcc --version


      - name: Setup toolchain
        run: |
          echo "$GITHUB_WORKSPACE/toolchains/clang-r365631c/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/toolchains/gcc64/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/toolchains/gcc32/bin" >> "$GITHUB_PATH"


      - name: Install stock running config
        run: |
          echo "=========================================="
          echo "Installing stock kernel configuration"
          echo "=========================================="

          if [ ! -f "config/running.config" ]; then
            echo "ERROR: config/running.config does not exist!"
            exit 1
          fi

          cp \
            config/running.config \
            out/.config

          echo
          echo "=========================================="
          echo "Config information"
          echo "=========================================="

          echo "running.config:"
          wc -l config/running.config

          echo
          echo "out/.config:"
          wc -l out/.config

          echo
          echo "=========================================="
          echo "Config SHA256"
          echo "=========================================="

          sha256sum config/running.config
          sha256sum out/.config


      - name: Run olddefconfig
        run: |
          echo "=========================================="
          echo "Running olddefconfig"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig


      - name: Generate config diff
        run: |
          echo "=========================================="
          echo "Generating config diff"
          echo "=========================================="

          echo
          echo "Original running.config:"
          wc -l config/running.config

          echo
          echo "Final out/.config:"
          wc -l out/.config

          diff -u \
            config/running.config \
            out/.config \
            > config.diff || true

          echo
          echo "=========================================="
          echo "CONFIG DIFF"
          echo "=========================================="

          if [ -s config.diff ]; then
            echo "Configuration changes detected:"
            cat config.diff
          else
            echo "No configuration changes detected."
          fi


      - name: Check audio configuration
        run: |
          echo "=========================================="
          echo "AUDIO / SOUND CONFIGURATION"
          echo "=========================================="

          grep -Ei \
            'CONFIG_(SND|SOUND|SLIMBUS|WCD|AUDIO|APR|Q6|ADSP|MSM_AUDIO|SPMI|REGMAP)' \
            out/.config \
            || true


      - name: Build kernel
        run: |
          export ARCH=arm64

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-"

          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-"

          export CLANG_TRIPLE=aarch64-linux-gnu-

          export PATH="$GITHUB_WORKSPACE/toolchains/clang-r365631c/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"

          echo "=========================================="
          echo "Build environment"
          echo "=========================================="

          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"
          echo "CLANG_TRIPLE=$CLANG_TRIPLE"

          echo
          echo "=========================================="
          echo "Starting kernel build"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32"


      - name: Check build outputs
        run: |
          echo "=========================================="
          echo "KERNEL BUILD OUTPUT"
          echo "=========================================="

          ls -lh out/arch/arm64/boot/

          echo
          echo "=========================================="
          echo "Image"
          echo "=========================================="

          if [ -f "out/arch/arm64/boot/Image" ]; then
            ls -lh out/arch/arm64/boot/Image
          else
            echo "WARNING: Image not found"
          fi

          echo
          echo "=========================================="
          echo "Image.gz"
          echo "=========================================="

          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            ls -lh out/arch/arm64/boot/Image.gz
          else
            echo "WARNING: Image.gz not found"
          fi

          echo
          echo "=========================================="
          echo "Image.gz-dtb"
          echo "=========================================="

          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            ls -lh out/arch/arm64/boot/Image.gz-dtb
          else
            echo "ERROR: Image.gz-dtb was not generated!"
            exit 1
          fi


      - name: Generate SHA256
        run: |
          cd out/arch/arm64/boot

          echo "=========================================="
          echo "SHA256"
          echo "=========================================="

          sha256sum Image \
            > Image.sha256

          if [ -f "Image.gz" ]; then
            sha256sum Image.gz \
              >> Image.sha256
          fi

          sha256sum Image.gz-dtb \
            >> Image.sha256

          echo
          cat Image.sha256


      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dipper-kernel
          if-no-files-found: error
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.sha256
            out/.config
            config/running.config
            config.diff
