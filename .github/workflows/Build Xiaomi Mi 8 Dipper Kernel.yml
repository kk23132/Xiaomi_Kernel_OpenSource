name: Build Xiaomi Mi 8 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout kernel source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1


      # ============================================================
      # 2. Dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libncurses5-dev \
            libncurses-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils


      # ============================================================
      # 3. Download AOSP GCC 4.9
      # ============================================================
      - name: Download AOSP GCC 4.9
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            gcc64

          test -x gcc64/bin/aarch64-linux-android-gcc

          echo "=========================================="
          echo "GCC version"
          echo "=========================================="

          gcc64/bin/aarch64-linux-android-gcc --version


      # ============================================================
      # 4. Prepare GCC environment
      # ============================================================
      - name: Setup GCC environment
        run: |
          echo "${GITHUB_WORKSPACE}/gcc64/bin" >> "$GITHUB_PATH"

          echo "GCC64=${GITHUB_WORKSPACE}/gcc64/bin" >> "$GITHUB_ENV"


      # ============================================================
      # 5. Verify GCC
      # ============================================================
      - name: Verify GCC
        run: |
          set -e

          echo "=========================================="
          echo "Checking GCC"
          echo "=========================================="

          which aarch64-linux-android-gcc

          aarch64-linux-android-gcc --version

          test -x "$GCC64/aarch64-linux-android-gcc"

          echo
          echo "GCC path:"
          echo "$GCC64/aarch64-linux-android-gcc"


      # ============================================================
      # 6. Prepare stock kernel config
      # ============================================================
      - name: Prepare kernel configuration
        run: |
          set -e

          if [ ! -f config/running.config ]; then
            echo "ERROR: config/running.config does not exist!"
            exit 1
          fi

          mkdir -p out

          cp config/running.config out/.config

          echo "=========================================="
          echo "Running olddefconfig"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "Config generated successfully."

          test -f out/.config


      # ============================================================
      # 7. Compare configuration
      # ============================================================
      - name: Compare kernel config
        run: |
          set +e

          diff -u \
            config/running.config \
            out/.config \
            > config.diff

          RESULT=$?

          echo "=========================================="
          echo "Configuration comparison"
          echo "=========================================="

          if [ "$RESULT" -eq 0 ]; then
            echo "No configuration differences."
          else
            echo "Configuration differences:"
            cat config.diff
          fi

          exit 0


      # ============================================================
      # 8. Build kernel with GCC 4.9
      #
      # IMPORTANT:
      #
      # Do NOT use CC=clang.
      # Do NOT use REAL_CC.
      #
      # This is a pure GCC build.
      # ============================================================
      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="${GCC64}/aarch64-linux-android-"

          echo "=========================================="
          echo "Kernel build configuration"
          echo "=========================================="

          echo "ARCH=${ARCH}"
          echo "SUBARCH=${SUBARCH}"
          echo "CROSS_COMPILE=${CROSS_COMPILE}"

          echo
          echo "=========================================="
          echo "Compiler"
          echo "=========================================="

          "${CROSS_COMPILE}gcc" --version

          echo
          echo "=========================================="
          echo "Starting kernel build"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            Image.gz-dtb \
            -j"$(nproc)"


      # ============================================================
      # 9. Verify output
      # ============================================================
      - name: Verify kernel output
        run: |
          set -e

          echo "=========================================="
          echo "Kernel output"
          echo "=========================================="

          find out/arch/arm64/boot \
            -maxdepth 1 \
            -type f \
            -printf "%f  %s bytes\n" \
            | sort

          echo
          echo "=========================================="
          echo "Checking Image.gz-dtb"
          echo "=========================================="

          test -f out/arch/arm64/boot/Image.gz-dtb

          ls -lh out/arch/arm64/boot/Image.gz-dtb


      # ============================================================
      # 10. Show important configuration
      # ============================================================
      - name: Show important kernel configuration
        run: |
          echo "=========================================="
          echo "Sound configuration"
          echo "=========================================="

          grep -E \
            '^(CONFIG_SND|CONFIG_SND_SOC|CONFIG_SLIMBUS|CONFIG_OF_SLIMBUS|CONFIG_MSM_ADSPRPC|CONFIG_MSM_PIL_MSS_QDSP6V5|CONFIG_SPMI|CONFIG_REGMAP_SPMI)' \
            out/.config \
            || true

          echo
          echo "=========================================="
          echo "Subsystem restart configuration"
          echo "=========================================="

          grep -E \
            '^(CONFIG_MSM_SUBSYSTEM_RESTART|CONFIG_IPA|CONFIG_QCOM_IPA)' \
            out/.config \
            || true


      # ============================================================
      # 11. Prepare artifacts
      # ============================================================
      - name: Prepare artifacts
        run: |
          set -e

          mkdir -p artifacts

          cp \
            out/arch/arm64/boot/Image.gz-dtb \
            artifacts/Image.gz-dtb

          cp \
            out/.config \
            artifacts/kernel.config

          cp \
            config/running.config \
            artifacts/running.config

          if [ -f config.diff ]; then
            cp config.diff artifacts/config.diff
          fi

          if [ -f out/System.map ]; then
            cp out/System.map artifacts/System.map
          fi

          if [ -f out/arch/arm64/boot/Image ]; then
            cp \
              out/arch/arm64/boot/Image \
              artifacts/Image
          fi

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp \
              out/arch/arm64/boot/Image.gz \
              artifacts/Image.gz
          fi

          echo "=========================================="
          echo "Artifacts"
          echo "=========================================="

          ls -lh artifacts/


      # ============================================================
      # 12. Upload artifacts
      # ============================================================
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dipper-kernel-gcc49
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
